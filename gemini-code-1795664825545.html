<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Portfolio | ครูผู้สอนเทคโนโลยีและการเขียนโปรแกรม</title>
    <!-- นำเข้าฟอนต์ Prompt จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ตั้งค่าตัวแปรสีและฟอนต์หลัก (ธีมน้ำเงิน-ขาว) */
        :root {
            --primary-blue: #1e40af;      /* น้ำเงินเข้ม */
            --secondary-blue: #3b82f6;    /* น้ำเงินสว่าง */
            --light-blue: #eff6ff;        /* ฟ้าอ่อนมากสำหรับพื้นหลัง */
            --accent-blue: #dbeafe;       /* ฟ้าอ่อนสำหรับขอบและไฮไลต์ */
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 10px 15px -3px rgba(30, 64, 175, 0.15), 0 4px 6px -2px rgba(30, 64, 175, 0.08);
        }

        /* รีเซ็ตค่าเริ่มต้น */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        /* แถบเมนูนำทาง (Navbar) */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .nav-container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-blue);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo span {
            background-color: var(--primary-blue);
            color: var(--white);
            padding: 0.15rem 0.5rem;
            border-radius: 6px;
            font-size: 1.1rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .nav-links a {
            font-weight: 500;
            color: var(--text-dark);
            transition: color 0.3s;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--secondary-blue);
        }

        .btn-github-nav {
            background-color: var(--primary-blue);
            color: var(--white) !important;
            padding: 0.5rem 1.1rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-github-nav:hover {
            background-color: var(--secondary-blue);
            transform: translateY(-2px);
        }

        /* ปุ่มเมนูสำหรับมือถือ */
        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background-color: var(--primary-blue);
            border-radius: 3px;
            transition: 0.3s;
        }

        /* โครงสร้าง Section ทั่วไป */
        section {
            padding: 5.5rem 1.5rem;
        }

        .container {
            max-width: 1140px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .section-header h2 {
            font-size: 2rem;
            color: var(--primary-blue);
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .section-header p {
            color: var(--text-muted);
            font-size: 1.05rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-divider {
            width: 60px;
            height: 4px;
            background-color: var(--secondary-blue);
            margin: 0.75rem auto 1rem;
            border-radius: 2px;
        }

        /* 1. ส่วนหน้าแรก (Hero Section) */
        #home {
            padding-top: 8.5rem;
            padding-bottom: 6rem;
            background: linear-gradient(135deg, var(--light-blue) 0%, var(--white) 100%);
            min-height: 90vh;
            display: flex;
            align-items: center;
